# 本repoの採用済み基準。導入先は定義・測定対象・分母・版・誤差を校正する。
# 圧縮率/意味保持率は補助指標であり、単独ではタスク成功を保証しない。
checklist_compliance_rate:
  comparator: min
  threshold: 95.0
  level: fail
  unit: percent
task_seed_cycle_time_minutes:
  comparator: max
  threshold: 1440.0
  level: fail
  unit: minutes
birdseye_refresh_delay_minutes:
  comparator: max
  threshold: 60.0
  level: fail
  unit: minutes
review_latency:
  comparator: max
  threshold: 12.0
  level: fail
  unit: hours
compress_ratio:
  comparator: max
  threshold: 0.60
  level: warn
  unit: ratio
semantic_retention:
  comparator: min
  threshold: 0.85
  level: warn
  unit: ratio
reopen_rate:
  comparator: max
  threshold: 5.0
  level: fail
  unit: percent
spec_completeness:
  comparator: min
  threshold: 90.0
  level: fail
  unit: percent
