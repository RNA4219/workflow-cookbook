name: test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  LANG: C.UTF-8
  UV_VERSION: "0.10.10"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --locked --extra dev
      - name: Ruff
        run: uv run --locked ruff check .

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --locked --extra dev
      - name: Mypy
        run: uv run --locked mypy .

  unit:
    name: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - uses: ./.github/actions/setup-test-integrations
      - name: Sync locked development environment
        run: uv sync --locked --extra dev
      - name: Pytest with coverage
        run: >-
          uv run --locked pytest -q -rs --fail-on-skip --junitxml=test-results/unit.xml
          --cov=tools
          --cov=security_headers
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-xml
          path: |
            coverage.xml
            test-results/unit.xml
          if-no-files-found: error

  python-312:
    name: Python 3.12 compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - uses: ./.github/actions/setup-test-integrations
      - name: Sync locked development environment
        run: uv sync --locked --extra dev
      - name: Pytest
        run: uv run --locked pytest -q -rs --fail-on-skip --junitxml=test-results/python-312.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junit-python-312
          path: test-results/python-312.xml
          if-no-files-found: error

  windows-adoption:
    name: Windows adoption regression
    runs-on: windows-2022
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install "uv==${{ env.UV_VERSION }}"
      - name: Sync locked development environment
        run: uv sync --locked --extra dev
      - name: Copy, Git checkout, tier, and drift regressions
        run: >-
          uv run --locked python -B -m pytest
          tests/test_adoption.py tests/test_check_adoption_tier.py tests/test_check_downstream_onboarding.py
          -m "not posix" -q -rs --fail-on-skip --junitxml=test-results/windows-adoption.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: junit-windows-adoption
          path: test-results/windows-adoption.xml
          if-no-files-found: error

      - name: Create Windows Git roundtrip bundle
        run: python -B tests/fixtures/adoption_git_roundtrip.py create --output "${{ runner.temp }}/adoption-roundtrip-windows"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: adoption-roundtrip-windows
          path: |
            ${{ runner.temp }}/adoption-roundtrip-windows/adoption.bundle
            ${{ runner.temp }}/adoption-roundtrip-windows/results.json
          if-no-files-found: error

  linux-adoption-roundtrip:
    name: Windows to Linux adoption roundtrip
    needs: [windows-adoption]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: adoption-roundtrip-windows
          path: ${{ runner.temp }}/adoption-roundtrip-input
      - name: Verify Windows bundle on Linux without installed dependencies
        run: >-
          python -I -S -B tests/fixtures/adoption_git_roundtrip.py verify
          --bundle "${{ runner.temp }}/adoption-roundtrip-input/adoption.bundle"
          --output "${{ runner.temp }}/adoption-roundtrip-linux"
          --require-posix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: adoption-roundtrip-linux
          path: ${{ runner.temp }}/adoption-roundtrip-linux/results.json
          if-no-files-found: error

  build:
    needs: [lint, typecheck, unit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Build wheel and source distribution
        run: uv build
      - name: Smoke-test non-editable wheel CLIs
        run: python tools/ci/smoke_wheel.py dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
